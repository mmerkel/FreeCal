[package]
name = "freecal"
description = "The FreeCal desktop app: the Tauri shell around the core"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde"] }
freecal-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon"] }
# The portal backend asks the desktop for its own file dialog, also from a Flatpak.
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-log = { version = "2", default-features = false }
tauri-plugin-opener = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
gdkwayland-sys = "0.18"
gtk = "0.18"
oo7 = "0.6"
# The KSNI backend of Tauri's tray crate, in place of AppIndicator, which
# gives the icon no clicks (ticket 13). With both on, the crate picks KSNI.
# This works only while the version matches the one Tauri uses (Cargo.lock
# must list one `tray-icon`); if Tauri moves on, move this along, or left
# clicks silently open the menu again. Drop it once Tauri has `linux-ksni`.
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }
zbus = "5"
