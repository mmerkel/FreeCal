[package]
name = "freecal-core"
description = "FreeCal's domain logic and Local Store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
icalendar = { version = "0.17", default-features = false, features = ["parser"] }
iso8601 = { version = "0.6", default-features = false }
quick-xml = "0.38"
rrule = "0.14"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["native-tls"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
tempfile = "3"
ts-rs = { version = "12", features = ["chrono-impl", "no-serde-warnings"] }
